name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MOONBIT_VERSION: 0.1.20260827

jobs:
  validate:
    name: Validate release-ready project
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon --version

      - name: Check formatting
        run: moon fmt --check

      - name: Type check without warnings
        run: moon check --deny-warn

      - name: Run test suite
        run: moon test

      - name: Regenerate and verify interfaces
        shell: bash
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: Run documented CLI examples
        shell: bash
        run: |
          moon run cmd/main -- ingest '{"event_id":"evt-1","severity":"INFO"}'
          moon run cmd/main -- analyze '{"event_id":"evt-1","severity":"INFO"}'
          moon run cmd/main -- verify 'evidence bytes'

      - name: Check release documentation
        shell: bash
        run: |
          test -f README.md
          test ! -e README.mbt.md
          test -f docs/release-checklist.md
